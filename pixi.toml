[workspace]
name = "xqtl-protocol"
channels = ["dnachun", "conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64"]

[system-requirements]
libc = { family="glibc", version="2.17" }

[tasks]
test = "pytest tests"
test_scripts = "pytest tests/scripts"
test_notebooks = "pytest tests/notebooks"

[dependencies]
"pytest" = "*"
"pytest-cov" = "*"
"python" = "3.12.*"
"sos" = "*"
"setuptools" = "<81"
"coreutils" = "*"
"bioconductor-annotationhub" = "*"
"bioconductor-biomart" = "*"
"bioconductor-clusterprofiler" = "*"
