"bioconductor-impute" = "*"
"bioconductor-minfi" = "*"
"bioconductor-minfidata" = "*"
"bioconductor-pcatools" = "*"
"bioconductor-psichomics" = "*"
"bioconductor-sesame" = "*"
"bioconductor-sesamedata" = "*"
"bioconductor-sva" = "*"
"bioconductor-txdbmaker" = "*"
"bioconductor-org.hs.eg.db" = "*"
"r-argparser" = "*"
"r-covr" = "*"
"r-testthat" = "*"
