name: Continuous Integration

on:
  pull_request:
    paths:
      - 'code/script/**'
      - 'code/SoS/**'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: wrapper-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pixi environment
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false

      - name: Run setup script
        env:
          INSTALL_TYPE: full
        run: |
          export PIXI_HOME=${HOME}/.pixi
          curl -fsSL https://raw.githubusercontent.com/StatFunGen/pixi-setup/main/pixi-setup.sh | bash

      # Companion retention change: StatFunGen/pecotmr#600.
      # Use its immutable revision until a released pecotmr includes the fix.
      - name: Install pecotmr with retained fSuSiE curves
        run: >-
          Rscript -e 'remotes::install_github("hsun3163/pecotmr@40b77e48a53d37b8b46fa897909585e6054a3c46",
          upgrade = "never")'

      - name: Script tests
        run: pytest tests/scripts -n logical --dist loadscope

      - name: Notebook tests
        run: pytest tests/notebooks -n logical --dist loadscope
