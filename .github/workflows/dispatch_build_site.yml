name: Dispatch rebuild website and manuscript

on:
  workflow_dispatch:

jobs:
  build_website:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.CI_TOKEN }}
          fetch-depth: 0

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          run-install: false

      - name: Build website and manuscript
        shell: pixi exec --spec jupyter-book --spec ghp-import --spec nbconvert -- bash -e {0}
        run: |
          rm -f pipeline/*.ipynb
          python website/build_support.py --stage-widget
          BASE_URL=/xqtl-protocol jupyter-book build --html
          python website/build_support.py --widget _build/html --redirects _build/html
          cp website/xqtl_flowchart.html _build/html/
          ghp-import -n -p -f _build/html
          # Link notebooks
          find code/SoS -name '*.ipynb' -not -path '*/.ipynb_checkpoints/*' -print0 | while IFS= read -r -d '' notebook; do
            ln -s "../${notebook}" "pipeline/$(basename "$notebook")"
          done

          # Make manuscript
          cd website/nature_protocol
          jupyter nbconvert --to notebook --execute conversion_notebook.ipynb && rm -f conversion_notebook.nbconvert.ipynb

      - name: Commit changes to pipeline
        uses: EndBug/add-and-commit@v11
        with:
          push: true
          message: Update pipeline
