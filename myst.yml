# MyST / Jupyter Book 2 configuration for the FunGen-xQTL protocol site.
#
# The TOC points at the notebooks where they actually live. MyST derives a flat
# page slug from each basename (code/SoS/reference_data/reference_data.ipynb ->
# /reference-data/) and resolves relative links and images itself, so no staging
# or link rewriting is needed. website/build_support.py handles only the two
# things MyST cannot: the workflow-builder widget and legacy-URL redirects.
version: 1
project:
  title: FunGen-xQTL Consortium
  authors:
    - name: The NIH/NIA Alzheimer's Disease Sequencing Project Functional Genomics xQTL Consortium
  copyright: 2021+, FunGen xQTL Analysis Working Group
  github: https://github.com/statfungen/xqtl-protocol
  funding:
    - statement: Supported by [NIH NIA](https://www.nia.nih.gov/research/ad-genetics)
  bibliography:
    - website/references.bib
  toc:
