<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>xQTL Analysis Workflow Builder</title><meta name="description" content="See how an xQTL analysis fits together, try it on the example data, then get the FunGen-xQTL protocol commands for your own study, in order, to copy or download."><link rel="canonical" href="https://statfungen.github.io/xqtl-protocol/xqtl_protocol_workflow_builder.html"><meta property="og:type" content="website"><meta property="og:site_name" content="FunGen-xQTL Protocol"><meta property="og:title" content="xQTL Analysis Workflow Builder"><meta property="og:description" content="Choose a molecular phenotype and an analysis goal to get the FunGen-xQTL protocol modules, in order, with example commands."><meta property="og:url" content="https://statfungen.github.io/xqtl-protocol/xqtl_protocol_workflow_builder.html"><meta name="twitter:card" content="summary"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"><style>body{margin:0;padding:24px 16px;background:#fff;color:#202b35}</style></head><body>
<div class="xqb" id="xqb"></div>
<script type="text/xml" id="xqb-tpl"><root><h1 class="hdt">xQTL Analysis Workflow Builder</h1>
<p class="xqb-lede">Try a tested example, or describe your study, to get the steps to run and one script for them.</p>

<div role="radiogroup" aria-label="How to begin" class="xqb-modes">
  <sc-for list="{{modes}}" as="md">
    <button type="button" id="{{md.rid}}" role="radio" aria-checked="{{md.checked}}" onClick="{{md.pick}}" style="{{md.style}}">
      <span style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
        <span style="font-size: 17px; font-weight: 700; color: var(--navy)">{{md.label}}</span>
        <span style="{{md.dot}}"></span>
      </span>
      <span style="display: block; font-size: 15px; line-height: 1.5; color: var(--ink); margin-top: 6px">{{md.desc}}</span>
    </button>
  </sc-for>
</div>

<sc-if value="{{isExample}}">
  <div role="radiogroup" aria-label="Example" class="xqb-examples">
    <sc-for list="{{examples}}" as="ex">
      <button type="button" id="{{ex.rid}}" role="radio" aria-checked="{{ex.ariaChecked}}" onClick="{{ex.pick}}" style="{{ex.style}}">
        <span style="display: block; font-size: 15px; font-weight: 700; color: var(--navy)">{{ex.title}}</span>
        <sc-if value="{{ex.notReady}}"><span style="display: block; margin: 6px 0"><span style="{{ex.tagStyle}}">{{ex.tag}}</span></span></sc-if>
        <span style="display: block; font-size: 13.5px; line-height: 1.4; color: var(--ink2); margin-top: 6px">{{ex.steps}}</span>
      </button>
    </sc-for>
  </div>
  <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px">
    <button type="button" onClick="{{resetAll}}" class="xqb-btn">Reset</button>
  </div>
  <div class="xqb-tut">
    <sc-for list="{{tut.items}}" as="t">
      <div><div class="xqb-k">{{t.k}}</div><div class="xqb-v">{{t.v}}</div></div>
    </sc-for>
  </div>
</sc-if>

  <sc-if value="{{isOwn}}">
    <div style="border: 1px solid var(--ln); border-radius: 8px; margin-top: 16px">
      <fieldset style="border: 0; margin: 0; padding: 16px 18px; border-bottom: 1px solid var(--ln)">
        <legend style="font-weight: 600; font-size: 15px; color: var(--navy); padding: 0; float: left; width: 100%; margin-bottom: 10px">What molecular phenotype are you studying?</legend>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; clear: both">
          <sc-for list="{{qPheno}}" as="o">
            <label style="{{o.style}}"><input type="radio" name="ph" checked="{{o.checked}}" onChange="{{o.pick}}" style="accent-color: var(--navy); margin: 0" />{{o.label}}</label>
          </sc-for>
        </div>
      </fieldset>
      <fieldset style="border: 0; margin: 0; padding: 16px 18px; border-bottom: 1px solid var(--ln)">
        <legend style="font-weight: 600; font-size: 15px; color: var(--navy); padding: 0; float: left; width: 100%; margin-bottom: 10px">What data do you already have?</legend>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; clear: both">
          <sc-for list="{{qStart}}" as="o">
            <label style="{{o.style}}"><input type="radio" name="start" checked="{{o.checked}}" onChange="{{o.pick}}" style="accent-color: var(--navy); margin: 0" />{{o.label}}</label>
          </sc-for>
        </div>
        <p style="margin: 8px 0 0; font-size: 14px; color: var(--ink2)">Processed phenotype matrix: normalized values, one row per gene or other trait and one column per sample (BED format).</p>
      </fieldset>
      <fieldset style="border: 0; margin: 0; padding: 16px 18px">
        <legend style="font-weight: 600; font-size: 15px; color: var(--navy); padding: 0; float: left; width: 100%; margin-bottom: 10px">What analyses do you want? <span style="font-weight: 400; color: var(--ink2); font-size: 14px">Choose any</span></legend>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; clear: both">
          <sc-for list="{{qGoals}}" as="o">
            <label style="{{o.style}}"><input type="checkbox" checked="{{o.checked}}" onChange="{{o.pick}}" style="accent-color: var(--navy); margin: 0" />{{o.label}}</label>
          </sc-for>
        </div>
        <sc-if value="{{hasContextual}}">
          <div style="margin-top: 14px; padding: 12px 14px; border-radius: 6px; background: var(--tint); display: flex; flex-direction: column; gap: 12px">
            <sc-for list="{{contextual}}" as="q">
              <div>
                <label for="{{q.id}}" style="display: block; font-size: 15px; font-weight: 600; margin-bottom: 6px">{{q.label}} <span style="font-weight: 400; color: var(--ink2)">· {{q.why}}</span></label>
                <select id="{{q.id}}" onChange="{{q.pick}}" value="{{q.value}}" style="font-size: 15px; min-height: 38px; padding: 6px 10px; border: 1px solid var(--ln2); border-radius: 6px; background: var(--bg); color: var(--ink); max-width: 100%">
                  <sc-for list="{{q.opts}}" as="op"><option value="{{op.v}}">{{op.label}}</option></sc-for>
                </select>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </fieldset>
      <div style="border-top: 1px solid var(--ln); padding: 8px 18px">
        <button type="button" aria-expanded="{{advExpanded}}" aria-controls="adv-opts" onClick="{{toggleAdv}}" style="font-size: 15px; min-height: 40px; padding: 6px 0; background: none; border: 0; color: var(--teal); font-weight: 600; cursor: pointer">{{advLabel}} <span style="font-weight: 400; color: var(--ink2); font-size: 14px">{{advCount}}</span></button>
        <sc-if value="{{adv}}">
          <div id="adv-opts" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 18px; padding: 6px 0 10px">
            <sc-for list="{{allOpts}}" as="q">
              <div>
                <label for="{{q.id}}" style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px">{{q.label}}</label>
                <select id="{{q.id}}" onChange="{{q.pick}}" value="{{q.value}}" style="width: 100%; font-size: 15px; min-height: 38px; padding: 6px 10px; border: 1px solid var(--ln2); border-radius: 6px; background: var(--bg); color: var(--ink)">
                  <sc-for list="{{q.opts}}" as="op"><option value="{{op.v}}">{{op.label}}</option></sc-for>
                </select>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{isOwn}}"><div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px"><button type="button" onClick="{{resetAll}}" class="xqb-btn">Reset</button></div></sc-if>
  <p role="status" aria-live="polite" style="{{msgStyle}}">{{msg}}</p>

<section id="route" aria-labelledby="r-h" style="margin: 36px 0 44px">
  <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; padding-bottom: 8px; border-bottom: 1px solid var(--ln)">
    <h2 id="r-h" style="font-size: 22px; font-weight: 600; color: var(--navy); margin: 0">1. Your analysis</h2>
  </div>
  <sc-if value="{{isOwnSrc}}"><div class="xqb-supply"><p style="margin: 0 0 6px; font-size: 15px"><span style="{{pathStatusStyle}}">{{pathStatus}}</span> <span style="color: var(--ink2)">Enter each one in the step that first needs it; paths stay in your browser.</span></p>
    <ul><sc-for list="{{supply}}" as="f"><li><a href="{{f.href}}">{{f.mark}}{{f.name}}</a> <span>{{f.step}}</span></li></sc-for></ul></div></sc-if>
  <sc-if value="{{routeEmpty}}">
    <div style="border: 1px dashed var(--ln2); border-radius: 8px; padding: 22px; text-align: center; color: var(--ink2); font-size: 15px">Choose an example or describe your study above to see your route.</div>
  </sc-if>
  <p style="margin: 12px 0 14px; font-size: 15.5px; line-height: 1.6">Your steps, numbered in the order they run, sit in their phase of the analysis. Open "Other modules" or a grey box to see the rest of a phase.</p>
  <div class="xqb-flow">
    <sc-for list="{{flow}}" as="p">
      <sc-if value="{{p.hasArrow}}"><div class="xqb-farrow" aria-hidden="true"></div></sc-if>
      <div class="xqb-fstage">
        <div class="xqb-fhead"><span class="xqb-fnum">{{p.num}}</span><span class="xqb-fk">{{p.kicker}}</span></div>
        <sc-if value="{{p.hasSteps}}">
          <ol class="xqb-steps">
            <sc-for list="{{p.steps}}" as="r">
          <li id="{{r.anchor}}" style="{{r.cardStyle}}">
            <div style="display: flex; gap: 14px; align-items: flex-start">
              <span style="{{r.numStyle}}">{{r.n}}</span>
              <div style="flex: 1 1 auto; min-width: 0">
                <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px">
                  <span style="font-weight: 600; font-size: 16px; color: var(--ink)">{{r.title}}</span>
                  <sc-if value="{{r.changed}}"><span style="font-size: 13.5px; font-weight: 600; color: var(--stf)">Changed</span></sc-if>
                </div>
                <div style="font-size: 15px; color: var(--ink2); margin-top: 3px; line-height: 1.45">{{r.metaLine}}</div>
                <sc-if value="{{r.notTested}}"><div style="margin-top: 6px"><span style="{{r.testStyle}}">{{r.tested}}</span></div></sc-if>
                <sc-if value="{{r.hasFiles}}">
                  <div class="xqb-files">
                    <div class="xqb-files-h">Files this step needs</div>
                    <ul>
                      <sc-for list="{{r.files}}" as="f">
                        <li>
                          <span class="xqb-file-name">{{f.label}}</span><span class="xqb-file-src">{{f.source}}</span>
                          <sc-if value="{{f.ask}}"><input id="{{f.id}}" class="xqb-path" type="text" value="{{f.value}}" onInput="{{f.set}}" placeholder="{{f.placeholder}}" aria-label="{{f.aria}}" /></sc-if>
                        </li>
                      </sc-for>
                    </ul>
                  </div>
                </sc-if>
              </div>
              <button type="button" id="{{r.btnId}}" aria-haspopup="dialog" onClick="{{r.toggle}}" style="{{r.btnStyle}}">{{r.btn}}</button>
            </div>
            <sc-if value="{{r.isOpen}}">
              <div class="xqb-modal" onClick="{{r.backdrop}}">
              <div role="dialog" aria-modal="true" aria-labelledby="xqb-step-h" class="xqb-stage" style="display: flex; flex-direction: column; gap: 14px">
                <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
                  <div><div class="xqb-k">STEP {{r.n}} OF YOUR ROUTE</div><h3 id="xqb-step-h" tabindex="-1" class="xqb-phase-h">{{r.title}}</h3><div style="font-size: 15px; color: var(--ink2); margin-top: 2px">{{r.module}} · {{r.methodLine}}</div></div>
                  <button type="button" onClick="{{r.close}}" aria-label="Close this step" class="xqb-x">×</button>
                </div>
                <div>
                  <div class="xqb-k" style="margin-bottom: 4px">WHY THIS STEP</div>
                  <p style="margin: 0; font-size: 15px; line-height: 1.6">{{r.why}}</p>
                </div>
                <sc-if value="{{r.hasChoices}}">
                  <fieldset style="border: 1px solid var(--ln); border-radius: 6px; margin: 0; padding: 10px 14px">
                    <legend style="font-size: 14px; font-weight: 600; color: var(--ink2); padding: 0 6px">Method</legend>
                    <div style="display: flex; flex-direction: column; gap: 6px">
                      <sc-for list="{{r.choices}}" as="c">
                        <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.45; cursor: pointer; padding: 4px 0">
                          <input type="radio" name="{{r.radioName}}" checked="{{c.checked}}" onChange="{{c.pick}}" style="accent-color: var(--navy); margin: 3px 0 0" />
                          <span><span style="font-weight: 600">{{c.label}}</span> <span style="{{c.tagStyle}}">{{c.tag}}</span><span style="display: block; color: var(--ink2); font-size: 14px">{{c.desc}}</span></span>
                        </label>
                      </sc-for>
                    </div>
                  </fieldset>
                </sc-if>
                <div><div class="xqb-k">INPUTS</div>
                  <ol class="xqb-mlist">
                    <sc-for list="{{r.inputs}}" as="f">
                      <li><div class="xqb-mrow"><span>{{f.name}} <span class="xqb-src">· {{f.source}}</span></span><sc-if value="{{f.hasPreview}}"><button type="button" aria-expanded="{{f.expanded}}" onClick="{{f.toggle}}" class="xqb-btn xqb-sm">{{f.btn}}</button></sc-if><sc-if value="{{f.fromStep}}"><button type="button" onClick="{{f.openStep}}" class="xqb-btn xqb-sm">Open step {{f.fromStep}}</button></sc-if></div>
                        <sc-if value="{{f.showPath}}"><div class="xqb-mono" style="color: var(--ink2); font-size: 13.5px">{{f.path}}</div></sc-if>
                        <sc-if value="{{f.open}}"><div style="margin: 8px 0 4px"><div style="font-size: 13.5px; color: var(--ink2); margin-bottom: 6px">{{f.note}}</div><div style="overflow-x: auto; border: 1px solid var(--ln); border-radius: 6px"><table style="border-collapse: collapse; font-family: var(--mono); font-size: 13.5px; white-space: nowrap; width: 100%"><thead><tr style="background: var(--tint)"><sc-for list="{{f.head}}" as="h"><th scope="col" style="text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--ln); font-weight: 600; color: var(--navy)">{{h.v}}</th></sc-for></tr></thead><tbody><sc-for list="{{f.rows}}" as="row"><tr><sc-for list="{{row.cells}}" as="cell"><td style="padding: 6px 10px; border-bottom: 1px solid var(--ln)">{{cell.v}}</td></sc-for></tr></sc-for></tbody></table></div></div></sc-if>
                      </li>
                    </sc-for>
                  </ol>
                </div>
                <div><div class="xqb-k">OUTPUTS</div>
                  <ol class="xqb-mlist">
                    <sc-for list="{{r.outputs}}" as="o">
                      <li><div class="xqb-mrow"><span class="xqb-mono">{{o.v}}</span><sc-if value="{{o.hasPreview}}"><button type="button" aria-expanded="{{o.expanded}}" onClick="{{o.toggle}}" class="xqb-btn xqb-sm">{{o.btn}}</button></sc-if></div>
                        <sc-if value="{{o.open}}"><div style="margin: 8px 0 4px"><div style="font-size: 13.5px; color: var(--ink2); margin-bottom: 6px">{{o.note}}</div><div style="overflow-x: auto; border: 1px solid var(--ln); border-radius: 6px"><table style="border-collapse: collapse; font-family: var(--mono); font-size: 13.5px; white-space: nowrap; width: 100%"><thead><tr style="background: var(--tint)"><sc-for list="{{o.head}}" as="h"><th scope="col" style="text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--ln); font-weight: 600; color: var(--navy)">{{h.v}}</th></sc-for></tr></thead><tbody><sc-for list="{{o.rows}}" as="row"><tr><sc-for list="{{row.cells}}" as="cell"><td style="padding: 6px 10px; border-bottom: 1px solid var(--ln)">{{cell.v}}</td></sc-for></tr></sc-for></tbody></table></div></div></sc-if>
                      </li>
                    </sc-for>
                  </ol>
                </div>
                <div>
                  <div class="xqb-k" style="margin-bottom: 6px">COMMAND FOR THIS STEP</div>
                  <pre class="xqb-code" tabindex="0">{{r.cmd}}</pre>
                </div>
                <sc-if value="{{r.hasTerms}}">
                  <div>
                    <div class="xqb-k" style="margin-bottom: 4px">TERMS</div>
                    <dl class="xqb-terms"><sc-for list="{{r.terms}}" as="tm"><dt>{{tm.k}}</dt><dd>{{tm.v}}</dd></sc-for></dl>
                  </div>
                </sc-if>
                <a href="{{r.doc}}" style="font-size: 15px; align-self: flex-start">Open the {{r.module}} notebook</a>
              </div>
              </div>
            </sc-if>
          </li>
            </sc-for>
          </ol>
          <button type="button" id="{{p.moreId}}" aria-haspopup="dialog" onClick="{{p.more}}" class="xqb-link xqb-more">Other modules in this phase</button>
        </sc-if>
        <sc-if value="{{p.noSteps}}">
        <div class="{{p.rowCls}}">
          <sc-for list="{{p.boxes}}" as="b">
            <button type="button" id="{{b.bid}}" aria-haspopup="dialog" aria-label="{{b.aria}}" onClick="{{b.pick}}" class="{{b.cls}}">
              <span class="xqb-ft">{{b.title}}</span>
              <sc-if value="{{b.hasSub}}"><span class="xqb-fsub">{{b.sub}}</span></sc-if>
            </button>
          </sc-for>
        </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <sc-if value="{{hasLoose}}">
    <ol class="xqb-steps" style="margin-top: 16px">
      <sc-for list="{{looseSteps}}" as="r">
      <li id="{{r.anchor}}" style="{{r.cardStyle}}">
        <div style="display: flex; gap: 14px; align-items: flex-start">
          <span style="{{r.numStyle}}">{{r.n}}</span>
          <div style="flex: 1 1 auto; min-width: 0">
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px">
              <span style="font-weight: 600; font-size: 16px; color: var(--ink)">{{r.title}}</span>
              <sc-if value="{{r.changed}}"><span style="font-size: 13.5px; font-weight: 600; color: var(--stf)">Changed</span></sc-if>
            </div>
            <div style="font-size: 15px; color: var(--ink2); margin-top: 3px; line-height: 1.45">{{r.metaLine}}</div>
            <sc-if value="{{r.notTested}}"><div style="margin-top: 6px"><span style="{{r.testStyle}}">{{r.tested}}</span></div></sc-if>
            <sc-if value="{{r.hasFiles}}">
              <div class="xqb-files">
                <div class="xqb-files-h">Files this step needs</div>
                <ul>
                  <sc-for list="{{r.files}}" as="f">
                    <li>
                      <span class="xqb-file-name">{{f.label}}</span><span class="xqb-file-src">{{f.source}}</span>
                      <sc-if value="{{f.ask}}"><input id="{{f.id}}" class="xqb-path" type="text" value="{{f.value}}" onInput="{{f.set}}" placeholder="{{f.placeholder}}" aria-label="{{f.aria}}" /></sc-if>
                    </li>
                  </sc-for>
                </ul>
              </div>
            </sc-if>
          </div>
          <button type="button" id="{{r.btnId}}" aria-haspopup="dialog" onClick="{{r.toggle}}" style="{{r.btnStyle}}">{{r.btn}}</button>
        </div>
        <sc-if value="{{r.isOpen}}">
          <div class="xqb-modal" onClick="{{r.backdrop}}">
          <div role="dialog" aria-modal="true" aria-labelledby="xqb-step-h" class="xqb-stage" style="display: flex; flex-direction: column; gap: 14px">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
              <div><div class="xqb-k">STEP {{r.n}} OF YOUR ROUTE</div><h3 id="xqb-step-h" tabindex="-1" class="xqb-phase-h">{{r.title}}</h3><div style="font-size: 15px; color: var(--ink2); margin-top: 2px">{{r.module}} · {{r.methodLine}}</div></div>
              <button type="button" onClick="{{r.close}}" aria-label="Close this step" class="xqb-x">×</button>
            </div>
            <div>
              <div class="xqb-k" style="margin-bottom: 4px">WHY THIS STEP</div>
              <p style="margin: 0; font-size: 15px; line-height: 1.6">{{r.why}}</p>
            </div>
            <sc-if value="{{r.hasChoices}}">
              <fieldset style="border: 1px solid var(--ln); border-radius: 6px; margin: 0; padding: 10px 14px">
                <legend style="font-size: 14px; font-weight: 600; color: var(--ink2); padding: 0 6px">Method</legend>
                <div style="display: flex; flex-direction: column; gap: 6px">
                  <sc-for list="{{r.choices}}" as="c">
                    <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.45; cursor: pointer; padding: 4px 0">
                      <input type="radio" name="{{r.radioName}}" checked="{{c.checked}}" onChange="{{c.pick}}" style="accent-color: var(--navy); margin: 3px 0 0" />
                      <span><span style="font-weight: 600">{{c.label}}</span> <span style="{{c.tagStyle}}">{{c.tag}}</span><span style="display: block; color: var(--ink2); font-size: 14px">{{c.desc}}</span></span>
                    </label>
                  </sc-for>
                </div>
              </fieldset>
            </sc-if>
            <div><div class="xqb-k">INPUTS</div>
              <ol class="xqb-mlist">
                <sc-for list="{{r.inputs}}" as="f">
                  <li><div class="xqb-mrow"><span>{{f.name}} <span class="xqb-src">· {{f.source}}</span></span><sc-if value="{{f.hasPreview}}"><button type="button" aria-expanded="{{f.expanded}}" onClick="{{f.toggle}}" class="xqb-btn xqb-sm">{{f.btn}}</button></sc-if><sc-if value="{{f.fromStep}}"><button type="button" onClick="{{f.openStep}}" class="xqb-btn xqb-sm">Open step {{f.fromStep}}</button></sc-if></div>
                    <sc-if value="{{f.showPath}}"><div class="xqb-mono" style="color: var(--ink2); font-size: 13.5px">{{f.path}}</div></sc-if>
                    <sc-if value="{{f.open}}"><div style="margin: 8px 0 4px"><div style="font-size: 13.5px; color: var(--ink2); margin-bottom: 6px">{{f.note}}</div><div style="overflow-x: auto; border: 1px solid var(--ln); border-radius: 6px"><table style="border-collapse: collapse; font-family: var(--mono); font-size: 13.5px; white-space: nowrap; width: 100%"><thead><tr style="background: var(--tint)"><sc-for list="{{f.head}}" as="h"><th scope="col" style="text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--ln); font-weight: 600; color: var(--navy)">{{h.v}}</th></sc-for></tr></thead><tbody><sc-for list="{{f.rows}}" as="row"><tr><sc-for list="{{row.cells}}" as="cell"><td style="padding: 6px 10px; border-bottom: 1px solid var(--ln)">{{cell.v}}</td></sc-for></tr></sc-for></tbody></table></div></div></sc-if>
                  </li>
                </sc-for>
              </ol>
            </div>
            <div><div class="xqb-k">OUTPUTS</div>
              <ol class="xqb-mlist">
                <sc-for list="{{r.outputs}}" as="o">

                  </li>
                </sc-for>
              </ol>
            </div>
            <div>
              <div class="xqb-k" style="margin-bottom: 6px">COMMAND FOR THIS STEP</div>
              <pre class="xqb-code" tabindex="0">{{r.cmd}}</pre>
            </div>
            <sc-if value="{{r.hasTerms}}">
              <div>
                <div class="xqb-k" style="margin-bottom: 4px">TERMS</div>
                <dl class="xqb-terms"><sc-for list="{{r.terms}}" as="tm"><dt>{{tm.k}}</dt><dd>{{tm.v}}</dd></sc-for></dl>
              </div>
            </sc-if>
            <a href="{{r.doc}}" style="font-size: 15px; align-self: flex-start">Open the {{r.module}} notebook</a>
          </div>
          </div>

      </li>
      </sc-for>
    </ol>
  </sc-if>
  <sc-if value="{{hasRoute}}"><p style="margin: 14px 0 0; font-size: 15px"><a href="#c-h">Continue to Prepare and run ↓</a></p></sc-if>

      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
        <div><div class="xqb-k">{{phase.kicker}}</div><h3 id="xqb-phase-h" tabindex="-1" class="xqb-phase-h">{{phase.label}}<span class="xqb-sr">, {{phase.srHint}}</span></h3></div>

            </div>
          </sc-for>

          <h4>{{mod.label}}</h4>

                  <sc-if value="{{f.open}}"><div style="margin: 8px 0 4px"><div style="font-size: 13.5px; color: var(--ink2); margin-bottom: 6px">{{f.note}}</div><div style="overflow-x: auto; border: 1px solid var(--ln); border-radius: 6px"><table style="border-collapse: collapse; font-family: var(--mono); font-size: 13.5px; white-space: nowrap; width: 100%"><thead><tr style="background: var(--tint)"><sc-for list="{{f.head}}" as="h"><th scope="col" style="text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--ln); font-weight: 600; color: var(--navy)">{{h.v}}</th></sc-for></tr></thead><tbody><sc-for list="{{f.rows}}" as="row"><tr><sc-for list="{{row.cells}}" as="cell"><td style="padding: 6px 10px; border-bottom: 1px solid var(--ln)">{{cell.v}}</td></sc-for></tr></sc-for></tbody></table></div></div></sc-if>

<section aria-labelledby="c-h" style="margin-bottom: 44px">
  <h2 id="c-h" style="font-size: 22px; font-weight: 600; color: var(--navy); margin: 0 0 6px; padding-bottom: 8px; border-bottom: 1px solid var(--ln)">2. Prepare and run</h2>
  <p style="margin: 12px 0 14px; font-size: 15.5px; line-height: 1.6">One script runs the whole route.</p>

  <div style="border: 1px solid var(--ln); border-radius: 8px; padding: 4px 18px; margin-bottom: 14px">
    <fieldset style="border: 0; margin: 0; padding: 12px 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px">
      <legend style="float: left; flex: 0 0 150px; padding: 0; font-size: 15px; font-weight: 600; color: var(--ink2)">Where it runs</legend>
      <sc-for list="{{runOn}}" as="p">
        <label style="{{p.style}}"><input type="radio" name="runon" checked="{{p.checked}}" onChange="{{p.pick}}" style="accent-color: var(--navy); margin: 0" />{{p.label}}</label>
      </sc-for>
    </fieldset>
  </div>

  <sc-if value="{{showCluster}}">
    <div style="border-radius: 6px; background: var(--acs); padding: 12px 14px; font-size: 15px; line-height: 1.55; margin-bottom: 14px"><strong style="color: var(--navy)">These are SoS commands that submit jobs to {{runOnName}} for you</strong>, through your cluster settings file <code style="font-family: var(--mono); font-size: 14px">my_cluster.yml</code> (copy it from <code style="font-family: var(--mono); font-size: 14px">code/cluster/{{runOnFile}}.yml</code>). They are not a native <code style="font-family: var(--mono); font-size: 14px">{{nativeCmd}}</code> script: run them on a login node and SoS submits and tracks each step. <a href="{{clusterDoc}}">Running on a cluster</a> explains the settings file.</div>
  </sc-if>

  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-bottom: 14px">
    <div style="border: 1px solid var(--ln); border-radius: 8px; padding: 14px 16px; background: var(--next)">
      <div style="font-size: 15px; font-weight: 600; color: var(--navy); margin-bottom: 6px">One-time setup</div>
      <ol style="margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.65">
        <sc-for list="{{setupOnce}}" as="b"><li>{{b.v}}</li></sc-for>
      </ol>
    </div>
    <div style="border: 1px solid var(--ln); border-radius: 8px; padding: 14px 16px; background: var(--next)">
      <div style="font-size: 15px; font-weight: 600; color: var(--navy); margin-bottom: 6px">For this route</div>
      <ol style="margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.65">
        <sc-for list="{{setupRoute}}" as="b"><li>{{b.v}}</li></sc-for>
      </ol>
    </div>
  </div>

  <sc-if value="{{hasStatus}}">
    <ul class="xqb-ready" aria-label="Readiness">
      <sc-for list="{{readiness}}" as="c"><li class="{{c.cls}}"><strong><span aria-hidden="true">{{c.mark}}</span> {{c.k}}</strong>{{c.v}}</li></sc-for>
    </ul>
    <p role="status" aria-live="polite" style="{{statusStyle}}"><strong>{{statusHead}}</strong> {{status}}</p>
  </sc-if>
  <div style="font-size: 15px; font-weight: 600; color: var(--navy); margin: 6px 0 6px">Complete route script</div>
<div style="border: 1px solid var(--ln); border-radius: 8px; background: var(--code); overflow: hidden">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--ln); background: var(--tint)">
      <span style="font-family: var(--mono); font-size: 14px; color: var(--ink2)">bash · {{fileName}} · {{srcLabel}}</span>
      <div style="display: flex; gap: 6px">
        <button type="button" onClick="{{copyScript}}" style="font-size: 14px; padding: 6px 12px; border: 0; background: transparent; border-radius: 6px; color: var(--ink2); min-height: 36px; cursor: pointer">{{copyScriptLabel}}</button>
        <button type="button" onClick="{{downloadScript}}" style="font-size: 14px; padding: 6px 12px; border: 1px solid var(--navy); background: var(--navy); border-radius: 6px; color: var(--on); min-height: 36px; cursor: pointer">Download .sh</button>
      </div>
    </div>
    <pre tabindex="0" style="margin: 0; padding: 14px 16px; overflow: auto; max-height: 460px; font-family: var(--mono); font-size: 14px; line-height: 1.65; color: var(--ink); white-space: pre">{{script}}</pre>
  </div>

  <sc-if value="{{isExampleSrc}}">
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; margin-top: 14px; padding: 14px 16px; border: 1px solid var(--ln); border-radius: 8px">
      <div style="min-width: 0; flex: 1 1 320px">
        <div style="font-size: 15px; font-weight: 600; color: var(--navy)">Ran the example? Use this workflow with your data.</div>
        <div style="font-size: 15px; color: var(--ink2); margin-top: 2px; line-height: 1.5">Keeps this route and its methods, and asks only for the {{ownNeed}} files to replace.</div>
      </div>
      <button type="button" onClick="{{useWithMine}}" style="font-size: 15px; min-height: 42px; padding: 8px 18px; border-radius: 6px; border: 1px solid var(--navy); background: var(--navy); color: var(--on); font-weight: 600; cursor: pointer">Use this workflow with my data</button>
    </div>
  </sc-if>

</section>

<section aria-labelledby="res-h" style="margin-bottom: 44px">
  <h2 id="res-h" style="font-size: 22px; font-weight: 600; color: var(--navy); margin: 0 0 6px; padding-bottom: 8px; border-bottom: 1px solid var(--ln)">3. Understand your results</h2>
  <p style="margin: 12px 0 14px; font-size: 15.5px; line-height: 1.6">The files to look at first.</p>

            </table>

      </div>
    </sc-for>
  </div>
  <sc-if value="{{hasInter}}">
    <details id="xqb-inter" style="border: 1px solid var(--ln); border-radius: 8px; padding: 10px 16px; margin-top: 10px">

      <table style="width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 8px">
        <tbody>
          <sc-for list="{{inter}}" as="e">
            <tr style="border-top: 1px solid var(--ln)"><td style="padding: 6px 10px 6px 0; color: var(--ink2); width: 70px">Step {{e.n}}</td><td style="padding: 6px 0; font-family: var(--mono); font-size: 13.5px; overflow-wrap: anywhere">{{e.path}}</td></tr>
          </sc-for>
        </tbody>
      </table>
    </details>
  </sc-if>
</section>

<section aria-labelledby="e-h" style="margin-bottom: 20px">
  <h2 id="e-h" style="font-size: 22px; font-weight: 600; color: var(--navy); margin: 0 0 6px; padding-bottom: 8px; border-bottom: 1px solid var(--ln)">4. All modules</h2>

      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>

    </label>
    <div role="group" aria-label="Show" style="display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{filters}}" as="f">
        <button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
      </sc-for>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px">
    <sc-for list="{{catalog}}" as="g">
      <div>
        <h3 style="font-size: 15px; font-weight: 600; letter-spacing: 0.04em; color: var(--ink2); margin: 0 0 6px">{{g.label}}</h3>
        <ul style="list-style: none; margin: 0; padding: 0; border: 1px solid var(--ln); border-radius: 8px">
          <sc-for list="{{g.items}}" as="it">
            <li style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; padding: 10px 14px; border-bottom: 1px solid var(--ln)">
              <div style="min-width: 0; flex: 1 1 260px"><a href="{{it.doc}}" style="font-size: 15px; font-weight: 600">{{it.label}}</a><div style="font-size: 14px; color: var(--ink2)">{{it.desc}}</div></div>
              <div style="display: flex; flex-wrap: wrap; gap: 6px">
                <sc-if value="{{it.onRoute}}"><span style="font-size: 13.5px; padding: 2px 8px; border-radius: 4px; background: var(--navy); color: var(--on)">On your route</span></sc-if>

              </div>
            </li>
          </sc-for>
        </ul>
      </div>
    </sc-for>
    <sc-if value="{{catalogEmpty}}"><p style="margin: 0; color: var(--ink2); font-size: 15px">No module matches.</p></sc-if>
  </div>
  </sc-if>
</section></root></script>

ended default."],["EBMF","EBMF (Empirical Bayes MF)",false,"Decomposes the matrix into latent factors with adaptive shrinkage, then reconstructs it. Captures global low-rank structure across all samples and features."],["missforest","missForest",false,"Non-parametric iterative random-forest imputation; each feature is predicted from the others until values stabilize. Handles non-linear relationships but is computationally heavier."],["missxgboost","missXGBoost",false,"Same iterative scheme with gradient-boosted trees instead of forests. Often faster and more accurate than missForest on large matrices."],["knn","KNN (k-nearest neighbors)",false,"Fills a gap with a distance-weighted average from the k most similar samples. Simple and fast; works well when samples cluster into similar profiles."],["soft","SoftImpute",false,"Matrix completion by iterative soft-thresholded SVD. A good linear baseline for structured data. Note: 450K methylation took ~15 min and ~34 GB RSS."],["mean","Mean imputation",false,"Replaces each gap with the feature mean. Fastest, but ignores all correlation structure. Use as a baseline, not a final choice."],["lod","LOD (limit of detection)",false,"Replaces gaps with a low constant derived from the smallest observed values. The right choice when missingness means 'below the assay's detection threshold'."]],"covariate_hidden_factor":[["Marchenko_PC","PCA + Marchenko-Pastur",true,"Regresses phenotype on known covariates, runs PCA on the residuals, and keeps the components whose eigenvalues exceed the Marchenko-Pastur random-matrix noise threshold. Used for the protocol's main analyses."],["PEER","PEER (GTEx-style)",false,"Probabilistic MOFA-based factor model. Factor count follows GTEx recommendations by sample size, or fix it with --N. Pick this for comparability with GTEx."],["PCA","PCA + Buja & Eyuboglu permutation",false,"Same PCA workflow, but factor count is chosen by permutation (--choose_k_method Buja_Eyuboglu, B=100) rather than the analytic threshold. Slower than Marchenko-Pastur for a similar answer."]],"gene_annotation":[["annotate_coord","Gene expression or protein matrix",true,"Matches each ENSEMBL gene ID against the GTF for coordinates. For proteins whose IDs look like gene_id|UniProt, pass --molecular-trait-type protein."],["map_leafcutter_cluster_to_gene","LeafCutter clusters to genes",false,"Assigns LeafCutter intron clusters to genes. Run this before annotating LeafCutter isoforms. Default --map-stra site maps introns by site."],["annotate_leafcutter_isoforms","LeafCutter isoforms",false,"Turns raw LeafCutter intron-excision output into a coordinate-annotated phenotype BED plus a phenotype-group file. Builds on the cluster-to-gene mapping."],["annotate_coord_biomart","biomaRt web service",false,"Fetches coordinates from Ensembl over the network instead of a local GTF. Requires a gene_ID column and a reachable Ensembl release."]],"mnm_regression":[["susie_twas","SuSiE (univariate)",true,"Univariate fine-mapping per phenotype. Also the route that produces TWAS prediction weights."],["mnm","mvSuSiE (multivariate)",false,"Multivariate across contexts, via mvSuSiE or mr.mash. Uses the mixture prior from MASH, so run MASH first. Also produces multi-context ensemble TWAS weights."],["mnm_genes","Multi-gene",false,"Fine-maps several genes sharing a locus jointly."],["fsusie","fSuSiE (functional)",false,"Functional regression for epigenomic QTLs."],["mvfsusie","mvfSuSiE (work in progress)",false,"Multivariate functional regression; WIP placeholder."]],"isoform_calling_torino":[["torino","Coverage components and usage from BAMs",true,"Reads coverage from each BAM, builds a depth matrix per gene, factorizes it into --K components and writes the cohort usage tables."],["torino_preprocessing","Depth matrices only",false,"Stops once the per-gene depth matrices are written."]],"splicing_calling_leafcutter2":[["leafcutter2","From BAM files",true,"Extracts junctions from each BAM with regtools, then clusters, classifies and quantifies them. The entry point for a full cohort."],["leafcutter2_cluster","From junction files",false,"Clusters, classifies and quantifies a list of existing junction files."],["leafcutter2_preprocessing","Junction extraction only",false,"Extracts junctions from the BAMs and writes the junction list, for clustering done elsewhere."],["star2junc","From STAR SJ.out.tab",false,"Converts STAR junction tables when the BAMs are not available; its output feeds the junction-file route."],["differential_splicing","Differential splicing between two groups",false,"Tests clustered intron counts between two groups with leafcutter_ds.R and recomputes the false discovery rate over all clusters."]]},"intro":{"GWAS_QC":"This module performs the standard quality-control pass on a merged PLINK genotype set. It estimates kinship to identify related individuals, filters variants and samples by allele frequency, missingness, and Hardy-Weinberg equilibrium, and prunes correlated variants for principal-component analysis.","METAL":"This notebook runs cross-cohort meta-analysis of summary statistics with METAL on the toy protocol_example dataset. METAL is a command-line tool that takes a script documenting the input summary-statistic files, the field mapping for each, and the analysis settings.","PCA":"Population structure is the classic confounder in genetic association: if ancestry correlates with both genotype and phenotype, unadjusted tests return associations that are real but not causal. The remedy is to compute principal components of the genotype matrix and carry the leading ones as covariates.","RNA_calling":"RNA-seq reads record the transcripts present in each sample. This module aligns reads to the reference genome and quantifies gene-level expression, producing the count and abundance matrices that define the molecular phenotype.","SuSiE_enloc":"This workflow processes fine-mapping results for xQTL, generated by susietwas in the mnm_regression.ipynb notebook for cis xQTL, and GWAS fine-mapping results produced by susierss in the rss_analysis.ipynb notebook. It is designed to perform enrichment and colocalization analysis, particularly when fine-mapping results originate from different regions in the case of cis-xQTL and GWAS.","TensorQTL":"This module tests whether inherited variants are associated with molecular phenotypes across individuals. Cis analysis focuses on variants near each feature, where regulatory effects are most interpretable, while trans analysis searches for distal effects.","VCF_QC":"Variant quality control removes genotypes that cannot support reliable regulatory mapping. The workflows normalize variant representation, restrict analysis to the intended samples and regions, remove poorly measured or uninformative variants, and harmonize identifiers before conversion to analysis-ready formats.","apa_calling":"Most genes have more than one polyadenylation site, and which one is used shifts the length of the 3' UTR, changing which regulatory elements survive in the transcript. Treating a gene as a single expression value hides that.","apa_impute":"Alternative polyadenylation is quantified as PDUI, the fraction of transcripts using the distal poly(A) site. DaPars leaves gaps wherever a gene had too little coverage in a sample to call that fraction, and downstream models need a complete matrix.","bulk_expression_QC":"Sample-level quality control asks whether each RNA-seq profile represents the intended biological specimen. The module compares expression patterns, sample annotations, and technical metrics to identify swaps, outliers, or globally degraded libraries.","bulk_expression_normalization":"Lowly expressed genes provide little reliable information for mapping genetic effects and can add noise to association testing. This step retains genes that are consistently detected across individuals, then normalizes their expression levels so differences in sequencing depth and RNA composition do not obscure biological variation.","colocboost":"Two signals at the same locus (a QTL and a GWAS hit, or QTLs in two cell types) may share a causal variant or merely sit in the same LD block. Colocalization tries to tell those apart.","covariate_formatting":"The association scan takes a single covariate file, but covariates arrive from several places: batch and demographic variables you supply, genotype principal components from PCA, and hidden factors from the Hidden Factors module. This step merges them, reconciles sample identifiers across the sources, and writes the combined matrix in the orientation the scan expects.","covariate_hidden_factor":"Unmeasured differences in batch, cell composition, RNA quality, or other latent processes can induce correlation among molecular phenotypes. This module estimates hidden factors from the phenotype matrix after accounting for known covariates.","ems_prediction":"Not yet available: the prediction step is not implemented, so this module does not produce scores yet. When finished, it will apply the CatBoost model (.cbm) from scEEMS Training to the variants of one cohort and chromosome, using the feature settings in the data config, and write the predicted probability that each variant is a causal eQTL","ems_training":"Most disease-associated GWAS variants lie in non-coding regions of the genome, where they likely modulate gene expression. However, bulk-tissue eQTL studies fail to explain the majority of these variants, a phenomenon termed \"missing regulation\" (Connally et al., 2022).","eoo_enrichment":"A variant set that overlaps an annotation more often than chance would predict is evidence that the annotation marks functional sequence. Counting the overlap is easy; putting an error bar on it is not, because variants are correlated along the genome and so cannot be resampled independently.","gene_annotation":"Molecular phenotype matrices arrive keyed only by a feature identifier, such as an ENSEMBL gene ID, a UniProt accession, or a LeafCutter intron-cluster label, but every downstream QTL step needs a genomic position to define a cis window. This module attaches those coordinates, turning a plain matrix into a coordinate-sorted, bgzipped and tabix-indexed bed.gz file.","generalized_TADB":"Analyses that work locus by locus need a definition of \"locus\". Using a fixed window around each gene is simple but arbitrary: regulatory contacts do not respect a fixed distance, and two genes in the same regulatory neighborhood get analyzed as if independent.","genotype_formatting":"Nothing here changes the genotypes; it changes how they are packaged. Tools in the protocol disagree about format (some want PLINK, some want VCF), and the association and fine-mapping steps run per region or per chromosome, so the genotype data has to be split the same way to be processed in parallel.","gregor":"A set of trait-associated variants is more interpretable if you can say what kind of sequence they fall in. Enrichment testing asks whether they overlap a class of genomic feature (an annotation, a chromatin state, a set of regulatory elements) more often than chance allows, where chance has to account for the fact that variants are not exchangeable: they differ in minor allele frequency, in the number of LD proxies they carry, and in distance to the nearest gene.","gsea":"A list of genes is hard to interpret on its own. Over-representation testing asks whether a group contains more members of some pathway or ontology term than chance would give, turning a list of identifiers into statements about biology.","intact":"INTACT combines evidence from PTWAS and fastENLOC for the same genes. It converts TWAS z-scores into Bayes factors across a grid of prior effect-size values, averages those Bayes factors, transforms the gene-level colocalization probability into a prior probability, and returns a posterior probability that integrates both sources of evidence.","ld_prune_reference":"Many downstream methods assume the variants they are handed are approximately independent. A reference genotype panel is not: neighbouring variants are correlated through linkage disequilibrium, so a raw variant list counts the same signal several times over.","mash_fit":"Effects estimated separately in each condition are noisy, and analyzing them one condition at a time ignores that most effects are shared. MASH fits a mixture of multivariate normal distributions to the effect estimates, learning from the data which patterns of sharing actually occur (which conditions move together, and how strongly), so that individual estimates can later be shrunk towards those patterns rather than towards zero.","mash_posterior":"For each input chunk (a list of matrices bhat/sbhat/Z), the posterior workflow loads the MASH model and calls mashcomputeposteriormatrices. Additional workflows compute posterior contrasts between conditions and feature-level scores (meta, fine-mapped, n-significant, and p-value pairs) from the contrast results.","mash_preprocessing":"This module constructs the three effect matrices used to learn cross-condition sharing patterns in MASH. The strong-effect matrix contains the top fine-mapped locus from each condition, the null matrix contains independent variants with small z-scores, and the random matrix samples variants from the supplied independent-variant list.","methylation_calling":"This module quantifies array-based DNA methylation using either sesame or minfi, with sesame recommended for the protocol. Both methods remove probes affected by SNPs or cross-reactivity, assess sample and probe quality, and correct assay bias before producing methylation measurements for downstream QTL analysis.","mixture_prior":"Genetic effects can be specific to one tissue or cell type, shared across several contexts, or similar across all contexts. MASH represents these possibilities as a mixture of covariance patterns.","mnm_regression":"An association scan tells you a region matters; it does not tell you which variant in it is responsible, because variants in linkage disequilibrium carry nearly the same signal. SuSiE reframes the question as variable selection: it fits a sum of single effects and returns credible sets (small groups of variants, each likely to contain one causal variant) together with posterior inclusion probabilities (Wang et al., 2020).","phenotype_formatting":"Association testing and fine-mapping run per chromosome or per region, so the phenotype matrix has to be partitioned the same way before that work can be parallelized. These workflows split a phenotype BED by chromosome or by region, annotate features against TAD boundaries when region-based analysis is wanted, and accept GCT-format input as well as BED.","phenotype_imputation":"Missing molecular measurements can arise when a feature falls below detection or is measured unreliably in a subset of samples. This module reconstructs missing values so downstream models can use a complete phenotype matrix.","pseudobulk_preprocessing":"This module prepares single-nucleus RNA-seq or ATAC-seq data for sample-level QTL analysis. It aggregates per-nucleus measurements into a pseudobulk count matrix for each cell type, harmonizes individual and sample identifiers across metadata and count matrices, then filters and normalizes the data before regressing technical covariates.","qr_and_twas":"Standard QTL mapping models the mean: it asks whether genotype shifts average expression. That misses variants whose effect is confined to part of the distribution, acting only in highly expressing samples, or changing spread rather than center.","qtl_association_postprocessing":"A cis scan reports a p-value for every variant against every molecular phenotype, which is not yet a result: the variants within a gene's window are correlated and the genes are many, so raw p-values overstate significance twice over. The correction is hierarchical, in three steps: local adjustment of the p-values of all cis variants within each gene, global adjustment of the minimum adjusted p-value across genes, then selection of the xQTLs whose locally adjusted p-value falls below the threshold (the eigenMT-BH procedure of Huang et al.","reference_data_preparation":"Every study that uses this protocol should start from the same reference files: the same genome build, the same gene annotation, the same variant lists. When those differ between steps or between cohorts, the failures are quiet ones: coordinates that shift by a base, genes that exist in one annotation and not the other, meta-analyses that silently drop variants.","rss_analysis":"Fine-mapping asks which variants in a region are consistent with a causal effect rather than merely correlated with one. SuSiE-RSS works from available summary data, specifically per-variant z-scores and an LD matrix from a reference panel, and returns credible sets with posterior inclusion probabilities (Zou et al., 2022).","rss_ld_sketch":"This module creates a compact LD reference from whole-genome sequencing genotypes. A random projection transforms the individual-by-variant genotype matrix into a smaller stochastic genotype matrix that preserves pairwise correlation structure approximately.","sldsc_enrichment":"Heritability is not distributed evenly across the genome. This module tests whether a functional category, such as a chromatin state, regulatory-element set, or xQTL annotation, explains more heritability than expected from its SNP count.","snRNAseq_preprocessing":"Single-nuclei RNA-seq counts arrive with artefacts that would otherwise be read as biology: dying cells with high mitochondrial content, ambient RNA carried over from the suspension, and droplets holding two nuclei rather than one. Filtering those out, and then deciding what cell type each surviving nucleus is, has to happen before any per-cell-type analysis can start.","splicing_calling":"This module converts STAR-aligned RNA-seq data into splicing phenotypes using two independent approaches. LeafCutter groups introns that share splice sites and reports each intron as a fraction of its cluster, which captures exon skipping and alternative splice-site usage without requiring predefined event labels (Li et al., 2018).","splicing_normalization":"Splicing measurements quantify how frequently alternative introns or transcript events are used across individuals. This module removes poorly measured events, adjusts the retained measurements for library and sample-level effects, and produces a stable splicing phenotype matrix.","twas_ctwas":"A TWAS scan tests each gene's genetically predicted expression against a trait, but a significant gene is not necessarily a causal one: nearby variants with direct effects on the trait, and the predicted expression of neighbouring genes, are correlated with the gene's own eQTLs and act as confounders. cTWAS addresses this by fine-mapping genes and variants jointly within a region, so a gene is credited only for signal that its expression explains beyond the surrounding variants and genes, and reports a posterior inclusion probability rather than a p-value (Zhao et al., 2024).","isoform_calling_torino":"This module turns aligned RNA-seq into isoform-level phenotypes without a transcript annotation. For each gene, Torino factorizes the per-base read depth across samples into a few coverage components, which capture cassette exons, retained introns, alternative first and last exons and alternative polyadenylation, and writes each sample's usage of every component as a phenotype table for QTL mapping.","splicing_calling_leafcutter2":"This module quantifies alternative splicing with LeafCutter2. Like splicing_calling, it groups introns that share splice sites into clusters and reports each intron as a fraction of its cluster, but it also labels every junction as productive or unproductive, so splicing changes that disrupt the protein can be told apart from those that do not.","qtl_rss_analysis":"This module fine-maps a cis /* Workflow Builder page: the Resources-site look (same tokens as website/fungen.css), scoped to .xqb */
.xqb{--navy:#19354a;--teal:#3d6289;--ink:#202b35;--ink2:#63717d;--ln:#dce3e8;--ln2:#c9d3da;--tint:#f6f8fa;--sk:#eef2f5;--acs:#e8eef5;--okb:#e3f1e8;--okf:#1f6b3d;--stb:#fbf0d9;--stf:#7a5300;--code:#f3f6f8;--next:#ffffff;--bg:#ffffff;--on:#ffffff;--wire:#9fb3c6;--shadow:var(--shadow);
  background:var(--bg);--sans:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  font-family:var(--sans);color:var(--ink);font-size:16px;line-height:1.5;max-width:900px;margin:0 auto;padding:8px 4px 60px}
.xqb a{color:var(--teal);text-decoration:none}.xqb a:hover{color:var(--navy);text-decoration:underline}
.xqb button,.xqb input,.xqb select{font-family:inherit}
.xqb :focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.xqb section{scroll-margin-top:12px}
/* in the site's frame the page title is already shown above */
html.xq-embedded body{padding:4px 12px 24px!important}
html.xq-embedded .xqb h1.hdt,.xq-widget>.xqb h1.hdt{display:none}
/* on the site's page the builder fills the content column */
.xq-widget>.xqb{max-width:none;padding:0 0 40px;background:transparent}
@media (max-width:600px){.xqb{font-size:15px}.xqb h1.hdt{font-size:26px!important}}
/* ---- redesigned top half ---- */
.xqb .xqb-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px;color:var(--ink2);font-weight:600;margin-bottom:10px}
.xqb .xqb-dot{width:9px;height:9px;background:var(--navy);border-radius:2px;display:inline-block}
.xqb h1.hdt{margin:0 0 10px;font-size:30px;line-height:1.2;font-weight:700;color:var(--navy)}
.xqb .xqb-lede{margin:0 0 20px;font-size:17px;line-height:1.6;color:var(--ink2)}
.xqb .xqb-h2{font-size:22px;font-weight:600;color:var(--navy);margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--ln)}
.xqb .xqb-k{font-size:13.5px;font-weight:600;letter-spacing:.06em;color:var(--ink2)}
.xqb .xqb-v{font-size:15px;line-height:1.5;margin-top:3px}
.xqb .xqb-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.xqb .xqb-examples{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.xqb .xqb-tut{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 18px;margin-top:10px;padding:12px 16px;border-radius:8px;background:var(--tint)}
/* the eight-phase map */
.xqb .xqb-map{display:flex;flex-direction:column;align-items:stretch;padding:2px 4px}
.xqb .xqb-row{display:grid;gap:10px;justify-items:center}
.xqb .xqb-r1{grid-template-columns:minmax(0,1fr)}
.xqb .xqb-r1>.xqb-node{width:min(100%,440px)}
.xqb .xqb-r1w{grid-template-columns:minmax(0,1fr)}
.xqb .xqb-r2{grid-template-columns:repeat(2,minmax(0,1fr))}
.xqb .xqb-r3c{grid-template-columns:repeat(3,minmax(0,1fr))}
.xqb .xqb-row>.xqb-node{width:100%}
.xqb .xqb-r1>.xqb-node{width:min(100%,440px)}
.xqb .xqb-refwrap{display:flex;gap:8px;align-items:stretch}
.xqb .xqb-refcol{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.xqb .xqb-refside{writing-mode:vertical-rl;transform:rotate(180deg);font-size:13.5px;color:var(--ink2);border-left:1px dashed var(--wire);padding:4px 3px;text-align:center}
.xqb .xqb-node{font:inherit;text-align:left;cursor:pointer;box-sizing:border-box;min-width:0;padding:10px 12px;border-radius:8px;background:var(--bg);color:var(--ink);border:1px solid var(--ln);box-shadow:0 1px 2px var(--shadow)}
.xqb .xqb-node:hover{border-color:var(--teal)}
.xqb .xqb-node.is-route{background:var(--acs);border-top:3px solid var(--teal)}
.xqb .xqb-node.is-off{opacity:.78}
.xqb .xqb-node.is-opt{border-style:dashed}
.xqb .xqb-node.is-route.is-opt{border-top-style:solid}
.xqb .xqb-node.is-sel{outline:2px solid var(--navy);outline-offset:1px;opacity:1}
.xqb .xqb-n-t{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--navy);line-height:1.3}
